<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login / Sign Up – AuraQR</title>

  <meta name="description"
        content="Login or create your AuraQR account to manage your QR codes and subscription.">

  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f8fbff, #eef4ff);
      color: #172033;
    }

    header {
      height: 72px;
      background: rgba(255,255,255,0.95);
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
    }

    .nav {
      width: 100%;
      max-width: 1180px;
      margin: auto;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #111827;
      font-size: 24px;
      font-weight: 800;
    }

    .logo img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 10px;
    }

    .back {
      text-decoration: none;
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
    }

    .container {
      min-height: calc(100vh - 72px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 45px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid #e0e6f0;
      border-radius: 22px;
      padding: 35px;
      box-shadow: 0 15px 45px rgba(30,64,175,0.10);
    }

    .top {
      text-align: center;
      margin-bottom: 28px;
    }

    .icon {
      width: 55px;
      height: 55px;
      margin: 0 auto 15px;
      border-radius: 16px;
      background: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
    }

    .top h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .top p {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .tab {
      border: none;
      background: transparent;
      padding: 11px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
      color: #64748b;
    }

    .tab.active {
      background: white;
      color: #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 11px;
      outline: none;
      font-size: 14px;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 11px;
      background: #2563eb;
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .terms {
      text-align: center;
      color: #94a3b8;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 22px;
    }

    .terms a {
      color: #64748b;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .auth-card {
        padding: 28px 20px;
      }

      .top h1 {
        font-size: 25px;
      }

      .back {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="nav">

      <a href="index.html" class="logo">
        <img src="logo.png" alt="AuraQR Logo">
        AuraQR
      </a>

      <a href="pricing.html" class="back">
        View Pricing →
      </a>

    </div>
  </header>


  <main class="container">

    <div class="auth-card">

      <div class="top">
        <div class="icon">🔐</div>

        <h1 id="title">Welcome back</h1>

        <p id="subtitle">
          Login to your AuraQR account
        </p>
      </div>


      <div class="tabs">

   <button type="button"
        class="tab active"
        id="loginTab"
        onclick="showLogin(); return false;">
  Login
</button>

<button type="button"
        class="tab"
        id="signupTab"
        onclick="showSignup(); return false;">
  Sign Up
</button>

      </div>


      <form id="authForm">

        <div class="form-group">

          <label for="email">
            Email address
          </label>

          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >

        </div>


        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
            minlength="6"
            autocomplete="current-password"
          >

        </div>


        <button
          type="submit"
          class="submit-btn"
          id="submitBtn">
          Login
        </button>

      </form>


      <div id="message" class="message"></div>


      <div class="terms">
        By continuing, you agree to AuraQR's terms and privacy policy.
      </div>

    </div>

  </main>


  <footer>
    © 2026 AuraQR
  </footer>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /* ==========================================
       SUPABASE CONFIGURATION
       ========================================== */

    const SUPABASE_URL =
      "https://vekdkldiujogcrpbefme.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
    sb_publishable_89DqCT4_d43Ow9kY0tscvQ_qrBdkgSI


    const { createClient } = supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


    /* ==========================================
       VARIABLES
       ========================================== */

    let currentMode = "login";


    const authForm =
      document.getElementById("authForm");

    const submitBtn =
      document.getElementById("submitBtn");

    const message =
      document.getElementById("message");

    const title =
      document.getElementById("title");

    const subtitle =
      document.getElementById("subtitle");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");


    /* ==========================================
       LOGIN TAB
       ========================================== */

    function showLogin() {

      currentMode = "login";

      title.textContent =
        "Welcome back";

      subtitle.textContent =
        "Login to your AuraQR account";

      submitBtn.textContent =
        "Login";

      loginTab.classList.add("active");

      signupTab.classList.remove("active");

      document
        .getElementById("password")
        .setAttribute(
          "autocomplete",
          "current-password"
        );

      clearMessage();
    }


    /* ==========================================
       SIGNUP TAB
       ========================================== */

    function showSignup() {

      currentMode = "signup";

      title.textContent =
        "Create your account";

      subtitle.textContent =
        "Start using AuraQR today";

      submitBtn.textContent =
        "Create Account";

      signupTab.classList.add("active");

      loginTab.classList.remove("active");

      document
        .getElementById("password")
        .setAttribute(
          "autocomplete",
          "new-password"
        );

      clearMessage();
    }


    /* ==========================================
       MESSAGE
       ========================================== */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;
    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";
    }


    /* ==========================================
       AUTH FORM
       ========================================== */

    authForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        submitBtn.disabled = true;


        try {

          /* LOGIN */

          if (currentMode === "login") {

            const { data, error } =
              await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
              });


            if (error) {
              throw error;
            }


            showMessage(
              "Login successful! Redirecting...",
              "success"
            );


            setTimeout(function() {

              window.location.href =
                "index.html";

            }, 1000);

          }


          /* SIGNUP */

          else {

            const { data, error } =
              await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                  emailRedirectTo:
                    "https://auraqr.in/index.html"
                }
              });


            if (error) {
              throw error;
            }


            showMessage(
              "Account created! Please check your email and confirm your account.",
              "success"
            );

          }


        } catch (error) {

          console.error(error);

          showMessage(
            error.message ||
            "Something went wrong. Please try again.",
            "error"
          );

        } finally {

          submitBtn.disabled = false;

        }

      }
    );


    /* ==========================================
       CHECK EXISTING SESSION
       ========================================== */

    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();


      if (session) {

        showMessage(
          "You are already logged in. Redirecting...",
          "success"
        );

        setTimeout(function() {

          window.location.href =
            "index.html";

        }, 800);

      }

    }


    checkSession();

  </script>

</body>
</html>
